name: DWD ICON-D2 SigWx Pipeline

on:
  schedule:
    # Läuft nach den DWD Hauptmodellläufen (00z, 03z, 06z, 09z, 12z, 15z, 18z, 21z) um Minute 45
    - cron: '45 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten über den GitHub 'Run workflow' Button

concurrency:
  group: sigwx-pipeline
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ecCodes & Python tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools bzip2 python3-pip python3-numpy python3-pil
          pip3 install --break-system-packages eccodes || pip3 install eccodes

      - name: Run DWD SigWx Generator
        run: |
          mkdir -p dist/sigwx
          if [ -f "scripts/generate_sigwx.py" ]; then
            python3 scripts/generate_sigwx.py
          elif [ -f "generate_sigwx.py" ]; then
            python3 generate_sigwx.py
          else
            echo "Fehler: generate_sigwx.py nicht gefunden!" && exit 1
          fi

      - name: Upload SigWx Overlays to netcup Webhosting via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/sigwx/
          server-dir: /httpdocs/data/sigwx/
          dangerous-clean-slate: false
