name: DWD ICON-D2 SigWx Pipeline

on:
  schedule:
    - cron: '45 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

concurrency:
  group: sigwx-pipeline
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    # Auf 30 Minuten anheben, damit Netzwerklags nicht zum Abbruch führen
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries
        # Schnelle non-interaktive Installation ohne hängende Mirrors
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libeccodes0 libeccodes-dev bzip2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install eccodes numpy pillow

      - name: Run DWD SigWx Generator & Uploader
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -f "scripts/generate_sigwx.py" ]; then
            python scripts/generate_sigwx.py
          elif [ -f "generate_sigwx.py" ]; then
            python generate_sigwx.py
          else
            echo "Fehler: generate_sigwx.py nicht gefunden!" && exit 1
          fi
