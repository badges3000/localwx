name: DWD ICON-D2 SigWx Pipeline

on:
  schedule:
    - cron: '45 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

concurrency:
  group: sigwx-pipeline
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ecCodes & Python Tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-eccodes python3-numpy python3-pil bzip2

      - name: Run DWD SigWx Generator
        run: |
          mkdir -p dist/sigwx
          if [ -f "scripts/generate_sigwx.py" ]; then
            python3 scripts/generate_sigwx.py
          elif [ -f "generate_sigwx.py" ]; then
            python3 generate_sigwx.py
          else
            echo "Fehler: generate_sigwx.py nicht gefunden!" && exit 1
          fi

      - name: Upload SigWx Overlays to netcup Webhosting via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/sigwx/
          server-dir: /httpdocs/data/sigwx/
          dangerous-clean-slate: false
