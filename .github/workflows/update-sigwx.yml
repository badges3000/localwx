name: DWD ICON-D2 SigWx Pipeline

on:
  schedule:
    - cron: '45 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

concurrency:
  group: sigwx-pipeline
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    # Auf 30 Minuten anheben, damit Netzwerklags nie wieder zum Abbruch führen
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries
        # Schnelle non-interaktive Installation (nur libeccodes0, IPv4 erzwungen)
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -y
          sudo apt-get install -y --no-install-recommends libeccodes0 bzip2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libeccodes.so.0 /usr/lib/x86_64-linux-gnu/libeccodes.so 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install eccodes numpy pillow

                - name: Run DWD Turbo Radar Generator & Uploader
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -f "scripts/generate_radar.py" ]; then
            python scripts/generate_radar.py
          elif [ -f "generate_radar.py" ]; then
            python generate_radar.py
          fi

      - name: Run DWD SigWx Generator & Uploader
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -f "scripts/generate_sigwx.py" ]; then
            python scripts/generate_sigwx.py
          elif [ -f "generate_sigwx.py" ]; then
            python generate_sigwx.py
          fi

      - name: Run DWD 5-Tage Europa-Trend Generator & Uploader
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -f "scripts/generate_europe_5d.py" ]; then
            python scripts/generate_europe_5d.py
          elif [ -f "generate_europe_5d.py" ]; then
            python generate_europe_5d.py
          fi

